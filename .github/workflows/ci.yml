name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PosternKit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          swift --version
      - name: Run the tests
        working-directory: Packages/PosternKit
        run: swift test

  # The core on the systems the Windows and Linux apps will run on. Allowed to fail while the port is under way.
  linux:
    name: PosternKit on Linux
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: swift --version
      - name: Run the tests
        working-directory: Packages/PosternKit
        run: swift test

  windows:
    name: PosternKit on Windows
    runs-on: windows-2025
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: Show the toolchain
        run: swift --version
      - name: Build
        working-directory: Packages/PosternKit
        run: swift build
      - name: Run the tests
        working-directory: Packages/PosternKit
        run: swift test

  scripts:
    name: Release script tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          swift --version
      - name: Test the release scripts
        run: scripts/tests/run.sh
