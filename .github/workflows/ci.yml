name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PosternKit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          swift --version
      - name: Run the tests
        working-directory: Packages/PosternKit
        run: swift test

  # The core on Linux, where the Linux app will run: every test, as on the Mac.
  linux:
    name: PosternKit on Linux
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: swift --version
      - name: Run the tests
        working-directory: Packages/PosternKit
        run: swift test

  # The core on Windows: the parts without network only, so allowed to fail while the port is under way.
  windows:
    name: PosternKit on Windows
    # Swift 6.2 builds against Visual Studio 2022; the 2025 image ships a newer STL that needs a newer Clang.
    # swift-crypto 5 needs 6.2.4 or later (it marks its enums @nonexhaustive), the version the Linux job runs too.
    runs-on: windows-2022
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          branch: swift-6.2.4-release
          tag: 6.2.4-RELEASE
      - name: Show the toolchain
        run: swift --version
      # The parts with no network. The Bridge and server targets wait for swift-nio-ssl's Windows support
      # (apple/swift-nio-ssl#567) and the MCP SDK's (modelcontextprotocol/swift-sdk#261).
      - name: Build the parts that run on Windows today
        working-directory: Packages/PosternKit
        shell: pwsh
        run: |
          foreach ($target in "PosternModel", "PosternText", "PosternMail", "PosternVault", "PosternPolicy", "PosternAudit", "PosternClients", "PosternCompose", "PosternApproval") {
            swift build --target $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # Postern for Linux: the core, the relay, the jailed reader, the command line and the GTK app, built with the Swift
  # runtime inside, tested, pictured with sample data, and packaged as .deb, .rpm and .tar.gz.
  desktop-linux:
    name: Postern for Linux
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, libadwaita and libsecret
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgtk-4-dev libadwaita-1-dev libsecret-1-dev \
            xvfb imagemagick dbus dbus-x11 fonts-cantarell fonts-dejavu-core adwaita-icon-theme >/dev/null
      - name: Restore the build cache
        uses: actions/cache/restore@v4
        with:
          path: Packages/PosternDesktop/.build
          key: linux-build-${{ hashFiles('Packages/PosternKit/Package.swift', 'Packages/PosternDesktop/Package.swift') }}-${{ github.sha }}
          restore-keys: linux-build-
      - name: Build the tests
        working-directory: Packages/PosternDesktop
        run: swift build --build-tests
      - name: Save the build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Packages/PosternDesktop/.build
          key: linux-build-${{ hashFiles('Packages/PosternKit/Package.swift', 'Packages/PosternDesktop/Package.swift') }}-${{ github.sha }}
      - name: Test
        working-directory: Packages/PosternDesktop
        run: swift test --skip-build
      - name: Build the release
        working-directory: Packages/PosternDesktop
        run: swift build -c release --static-swift-stdlib
      - name: Picture the app with sample data
        run: |
          mkdir -p /usr/share/icons/hicolor/scalable/apps
          cp packaging/linux/icons/*.svg /usr/share/icons/hicolor/scalable/apps/
          scripts/linux-screenshots.sh Packages/PosternDesktop/.build/release/postern-app Packages/PosternDesktop/screenshots
      - name: Package
        env:
          NFPM_VERSION: "2.40.0"
          POSTERN_VERSION: "2.0.0"
        run: |
          mkdir -p stage dist
          for program in postern-core postern-parser postern-app postern-mcp postern; do
            cp Packages/PosternDesktop/.build/release/$program stage/
            strip stage/$program
          done
          curl -fsSL -o /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o /tmp/checksums.txt "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt"
          (cd /tmp && grep " nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz$" checksums.txt | sha256sum -c -)
          tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          NFPM_ARCH=amd64 nfpm package --config packaging/linux/nfpm.yaml --packager deb --target dist/
          NFPM_ARCH=amd64 nfpm package --config packaging/linux/nfpm.yaml --packager rpm --target dist/
          archive=postern-${POSTERN_VERSION}-linux-x86_64
          mkdir -p $archive/bin $archive/share
          cp stage/* $archive/bin/
          cp packaging/linux/postern.socket packaging/linux/postern.service packaging/linux/ch.rubencatalao.postern.policy \
             packaging/linux/ch.rubencatalao.postern.desktop packaging/linux/icons/*.svg $archive/share/
          cp packaging/linux/install.sh LICENSE $archive/
          tar -czf dist/$archive.tar.gz $archive
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          path: Packages/PosternDesktop/screenshots
          retention-days: 7

  scripts:
    name: Release script tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          swift --version
      - name: Test the release scripts
        run: scripts/tests/run.sh
