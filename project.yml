name: Postern
options:
  bundleIdPrefix: ch.rubencatalao.postern
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.1"
    # The build number Sparkle compares to decide what is newer: a whole number, raised by one with every release
    # (0.1.0 shipped as 1). scripts/release.sh refuses a build number the appcast already has.
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: D8HG34L8XK
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
packages:
  PosternKit:
    path: Packages/PosternKit
  # Updates, and the only connection Postern makes besides Bridge (docs/threat-model.md). Pinned exactly.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Postern:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.rubencatalao.postern
        PRODUCT_NAME: Postern
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Postern
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Ruben Catalao. MIT License."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: Postern
        # Only an update rehearsal points it elsewhere, on the command line; scripts/release.sh checks it.
        POSTERN_FEED_URL: https://getpostern.vercel.app/appcast.xml
    # The keys Xcode cannot generate. Sparkle reads a signed feed on the website and installs only disk images signed
    # with Postern's EdDSA key. Postern is sandboxed: Sparkle's installer launcher service (in Sparkle.framework) does
    # the install outside the sandbox. Updates are never installed silently: each one is "Install and Relaunch", and
    # the relaunch registers the launch agent again when its plist changed (App/AppHandoff.swift).
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: $(POSTERN_FEED_URL)
        SUPublicEDKey: "NRXK25IiVp4F4ZLg7KAsHLdLxurM7R5EmKtDrlt0ATs="
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableInstallerLauncherService: true
        SUAllowsAutomaticUpdates: false
    # The core holds the secrets: sandboxed, network limited to outgoing connections (Bridge on the loopback
    # address), its own application group for the Mach service name, and its own Keychain access group.
    entitlements:
      path: App/Postern.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - D8HG34L8XK.ch.rubencatalao.postern
        keychain-access-groups:
          - $(AppIdentifierPrefix)ch.rubencatalao.postern
        # The Connect buttons: the configuration files of Claude Code, Claude Desktop and Codex, and any other
        # Claude Code profile folder the user picks.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /.claude.json
          - /Library/Application Support/Claude/
          - /.codex/
        com.apple.security.files.user-selected.read-write: true
        # Saved attachments and the outbox, both in Downloads › Postern.
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Sparkle's installer reaches the app through these two names (sparkle-project.org/documentation/sandboxing).
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - ch.rubencatalao.postern-spks
          - ch.rubencatalao.postern-spki
    dependencies:
      - package: PosternKit
        product: PosternModel
      - package: PosternKit
        product: PosternBridge
      - package: PosternKit
        product: PosternVault
      - package: PosternKit
        product: PosternPolicy
      - package: PosternKit
        product: PosternServer
      - package: PosternKit
        product: PosternAudit
      - package: PosternKit
        product: PosternClients
      - package: PosternKit
        product: PosternCompose
      - package: PosternKit
        product: PosternApproval
      - package: Sparkle
      - target: postern-mcp
        link: false
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: PosternParser
        embed: true
    postBuildScripts:
      - name: Embed the launch agent
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          cp "$SRCROOT/App/LaunchAgents/ch.rubencatalao.postern.core.plist" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents/"
        basedOnDependencyAnalysis: false
  postern-mcp:
    type: tool
    platform: macOS
    sources:
      - Relay
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.rubencatalao.postern.mcp
        PRODUCT_NAME: postern-mcp
        # Shipped inside Postern.app (Contents/Helpers), never installed on its own: an archive must hold the app only.
        SKIP_INSTALL: YES
  PosternParser:
    type: xpc-service
    platform: macOS
    sources:
      - ParserService
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.rubencatalao.postern.parser
        PRODUCT_NAME: PosternParser
        SKIP_INSTALL: YES
    info:
      path: ParserService/Info.plist
      properties:
        CFBundleDisplayName: PosternParser
        XPCService:
          ServiceType: Application
    # Hostile input is parsed here: the sandbox with no other entitlement means no network, no Keychain, no files.
    entitlements:
      path: ParserService/PosternParser.entitlements
      properties:
        com.apple.security.app-sandbox: true
    dependencies:
      - package: PosternKit
        product: PosternMail
      - package: PosternKit
        product: PosternModel
